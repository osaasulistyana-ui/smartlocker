<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Diri - Smart Locker</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif; background: #1a1a2e;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px;
    }
    .container { width: 100%; max-width: 440px; }
    h1 { color: white; font-size: 24px; text-align: center; margin-bottom: 6px; }
    .sambutan { color: #aaa; text-align: center; font-size: 14px; margin-bottom: 20px; }
    .card {
      background: white; border-radius: 16px; padding: 28px;
    }
    .loker-dipilih {
      background: #e8f5e9; border: 1px solid #a5d6a7;
      border-radius: 10px; padding: 10px 14px;
      font-size: 14px; color: #2e7d32; margin-bottom: 20px;
    }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
    .form-group input {
      width: 100%; padding: 11px 14px; border: 1px solid #ddd;
      border-radius: 8px; font-size: 14px; outline: none;
      transition: border-color 0.2s;
    }
    .form-group input:focus { border-color: #1a1a2e; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    .btn-kembali {
      flex: 1; padding: 11px; border: 1px solid #ddd; border-radius: 8px;
      background: #f5f5f5; color: #555; font-size: 14px; cursor: pointer;
    }
    .btn-lanjut {
      flex: 2; padding: 11px; border: none; border-radius: 8px;
      background: #1a1a2e; color: white; font-size: 14px;
      font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn-lanjut:hover { background: #2d2d5e; }
    .watermark { color: #555; font-size: 12px; text-align: center; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Smart Locker</h1>
    <p class="sambutan">Isi Data Diri</p>
    <div class="card">
      <div class="loker-dipilih">🔒 Loker dipilih: <strong id="namaLoker">-</strong></div>

      <div class="form-group">
        <label>👤 Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap">
      </div>
      <div class="form-group">
        <label>📅 Tanggal Pemakaian</label>
        <input type="date" id="tanggal">
      </div>
      <div class="form-group">
        <label>🏠 Alamat</label>
        <input type="text" id="alamat" placeholder="Masukkan alamat">
      </div>
      <div class="form-group">
        <label>📱 Nomor HP</label>
        <input type="tel" id="nomorHP" placeholder="Contoh: 08123456789" maxlength="15">
      </div>

      <div class="btn-group">
        <button class="btn-kembali" onclick="window.location.href='pilih-loker.html'">← Kembali</button>
        <button class="btn-lanjut" onclick="lanjutkan()">Lanjutkan →</button>
      </div>
    </div>
    <p class="watermark">@Smart Loker_Tugas Akhir Osa</p>
  </div>

  <script>
    window.onload = function () {
      const nama = localStorage.getItem('loker_dipilih_nama');
      if (!nama) { window.location.href = 'pilih-loker.html'; return; }
      document.getElementById('namaLoker').textContent = nama;
      // Set tanggal default hari ini
      document.getElementById('tanggal').value = new Date().toISOString().split('T')[0];
    };

    function lanjutkan() {
      const nama    = document.getElementById('nama').value.trim();
      const tanggal = document.getElementById('tanggal').value;
      const alamat  = document.getElementById('alamat').value.trim();
      const hp      = document.getElementById('nomorHP').value.trim();

      if (!nama)    { alert('Masukkan nama lengkap!'); return; }
      if (!tanggal) { alert('Pilih tanggal pemakaian!'); return; }
      if (!alamat)  { alert('Masukkan alamat!'); return; }
      if (!hp)      { alert('Masukkan nomor HP!'); return; }

      const data = {
        nama, tanggal_pakai: tanggal, alamat, no_hp: hp,
        nomor_loker: localStorage.getItem('loker_dipilih_id'),
        nama_loker:  localStorage.getItem('loker_dipilih_nama')
      };
      localStorage.setItem('data_titip', JSON.stringify(data));
      window.location.href = 'verifikasi-otp.html';
    }
  </script>
</body>
</html>
