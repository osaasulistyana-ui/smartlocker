<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pilih Loker - SmartLocker</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: #1a2332;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 36px 20px 60px;
    }

    .header { text-align: center; margin-bottom: 28px; }
    .header h1 { font-size: 2rem; font-weight: 800; }
    .header p { color: #90a4ae; font-size: 0.9rem; margin-top: 6px; }

    .legend {
      display: flex;
      gap: 24px;
      margin-bottom: 28px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #cfd8dc;
    }

    .legend-dot {
      width: 18px;
      height: 18px;
      border-radius: 5px;
    }

    .dot-hijau { background: #4caf50; }
    .dot-merah { background: #ef5350; }

    #gridLoker {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      width: 100%;
      max-width: 420px;
    }

    .loker-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 36px 16px;
      border-radius: 20px;
      border: none;
      font-family: 'Poppins', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      cursor: pointer;
      color: #fff;
      transition: transform 0.15s, box-shadow 0.2s, filter 0.15s;
    }

    .loker-box span {
      font-size: 0.8rem;
      font-weight: 500;
      opacity: 0.9;
    }

    .loker-box.kosong {
      background: #4caf50;
      box-shadow: 0 4px 20px rgba(76,175,80,0.3);
    }

    .loker-box.kosong:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(76,175,80,0.5);
      filter: brightness(1.1);
    }

    .loker-box.terisi {
      background: #ef5350;
      box-shadow: 0 4px 20px rgba(239,83,80,0.3);
    }

    .loker-box.terisi:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 30px rgba(239,83,80,0.5);
      filter: brightness(1.1);
    }

    .msg {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: #90a4ae;
      font-size: 0.9rem;
    }

    .msg.error { color: #ef5350; }

    .footer {
      margin-top: 48px;
      color: #455a64;
      font-size: 0.78rem;
    }

    .popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 200;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
    }

    .popup-overlay.aktif { display: flex; }

    .popup-box {
      background: #243447;
      border: 1px solid #ef5350;
      border-radius: 20px;
      padding: 32px 28px;
      max-width: 340px;
      width: 90%;
      text-align: center;
      animation: popIn 0.2s ease;
    }

    @keyframes popIn {
      from { transform: scale(0.88); opacity: 0; }
      to   { transform: scale(1);    opacity: 1; }
    }

    .popup-box h2 { font-size: 1.15rem; color: #ef5350; margin-bottom: 20px; }

    .popup-row {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px solid #2e4060;
      font-size: 0.88rem;
    }

    .popup-row:last-of-type { border-bottom: none; }
    .popup-row .label { color: #78909c; }
    .popup-row .value { color: #eceff1; font-weight: 600; }

    .popup-btn {
      margin-top: 22px;
      padding: 11px 36px;
      border: none;
      border-radius: 10px;
      background: #ef5350;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .popup-btn:hover { background: #c62828; }
  </style>
</head>
<body>

  <div class="header">
    <h1>📦 Pilih Loker</h1>
    <p>Pilih loker yang tersedia untuk menitipkan barang Anda</p>
  </div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot dot-hijau"></div>
      Kosong (tersedia)
    </div>
    <div class="legend-item">
      <div class="legend-dot dot-merah"></div>
      Terisi (tidak tersedia)
    </div>
  </div>

  <div id="gridLoker">
    <p class="msg">⏳ Memuat loker...</p>
  </div>

  <div id="popupTerisi" class="popup-overlay">
    <div class="popup-box">
      <h2>🔴 Loker Terisi</h2>
      <div class="popup-row">
        <span class="label">Nama</span>
        <span class="value" id="namaPopup">-</span>
      </div>
      <div class="popup-row">
        <span class="label">Alamat</span>
        <span class="value" id="alamatPopup">-</span>
      </div>
      <button class="popup-btn" onclick="tutupPopup()">Tutup</button>
    </div>
  </div>

  <div class="footer">@Smart Locker_Tugas Akhir</div>

  <script>
    const BASE = 'https://smartlocker-ta.infinityfree.me/pages';

    async function muatLoker() {
      const grid = document.getElementById('gridLoker');
      try {
        const res  = await fetch(`${BASE}/get-loker.php`);
        const data = await res.json();
        grid.innerHTML = '';

        if (data.status !== 'success' || !data.data || data.data.length === 0) {
          grid.innerHTML = '<p class="msg">Tidak ada loker tersedia.</p>';
          return;
        }

        data.data.forEach(loker => {
          const box = document.createElement('button');
          box.className = 'loker-box ' + (loker.status === 'kosong' ? 'kosong' : 'terisi');
          box.innerHTML = `${loker.nomor_loker}<span>${loker.status === 'kosong' ? 'Tersedia' : 'Terisi'}</span>`;

          if (loker.status === 'kosong') {
            box.onclick = () => pilihLoker(loker.nomor_loker);
          } else {
            box.onclick = () => lihatPengguna(loker.nomor_loker);
          }

          grid.appendChild(box);
        });

      } catch (e) {
        grid.innerHTML = '<p class="msg error">⚠️ Gagal memuat loker. Cek koneksi internet.</p>';
        console.error('muatLoker error:', e);
      }
    }

    function pilihLoker(nomor) {
      localStorage.setItem('loker_dipilih', nomor);
      window.location.href = 'form-data.html';
    }

    async function lihatPengguna(nomor) {
      try {
        const res  = await fetch(`${BASE}/get-pengguna-loker.php?loker=${encodeURIComponent(nomor)}`);
        const data = await res.json();

        if (data.status === 'success' && data.nama) {
          const nama   = data.nama;
          const sensor = nama[0] + '*'.repeat(Math.max(nama.length - 1, 2));
          document.getElementById('namaPopup').textContent   = sensor;
          document.getElementById('alamatPopup').textContent = data.alamat
            ? data.alamat.substring(0, 10) + '...' : '-';
        } else {
          document.getElementById('namaPopup').textContent   = 'Tidak diketahui';
          document.getElementById('alamatPopup').textContent = '-';
        }

        document.getElementById('popupTerisi').classList.add('aktif');

      } catch (e) {
        alert('Gagal mengambil data pengguna.');
      }
    }

    function tutupPopup() {
      document.getElementById('popupTerisi').classList.remove('aktif');
    }

    document.addEventListener('DOMContentLoaded', muatLoker);
  </script>

</body>
</html>
